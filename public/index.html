<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="site-header">
        <h1><h1>Gerador de QR Code </h1>
    </header>
  
    <!--Conteúdo principal-->
    <main class="container">
        <section class="url-section">
            <!--Formulário do Url-->
            <form action="/generateQR" method="POST">
                <div class="input-row">
                    <label for="url-input"></label>
                    <input 
                        type="text"
                        placeholder="Digite seu URL aqui"
                        id="url-input"
                        name="url-input"
                        required>
                    <label for="url-submit">
                    <input 
                        type="submit" 
                        value="Gerar o QR Code"
                        id="url-submit">
                    </label>
                </div>
            </form>
        </section>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
